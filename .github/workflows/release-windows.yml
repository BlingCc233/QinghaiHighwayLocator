name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v0.0.2
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release Windows x64 executable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: QinghaiHighwayLocator
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: QinghaiHighwayLocator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: QinghaiHighwayLocator/frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          (Join-Path (go env GOPATH) "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build executable
        run: wails3 build

      - name: Build CLI executable
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w -X main.version=$($env:RELEASE_TAG.TrimStart('v'))" -o bin/omap-import.exe ./cmd/omap-import

      - name: Stage release asset
        shell: pwsh
        run: |
          $assetName = "QinghaiHighwayLocator-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item bin/qinghaihighwaylocator.exe "bin/$assetName"
          $cliAssetName = "omap-import-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item bin/omap-import.exe "bin/$cliAssetName"
          "GUI_RELEASE_ASSET=bin/$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLI_RELEASE_ASSET=bin/$cliAssetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QinghaiHighwayLocator-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            QinghaiHighwayLocator/${{ env.GUI_RELEASE_ASSET }}
            QinghaiHighwayLocator/${{ env.CLI_RELEASE_ASSET }}
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG $env:GUI_RELEASE_ASSET $env:CLI_RELEASE_ASSET --title $env:RELEASE_TAG --generate-notes
