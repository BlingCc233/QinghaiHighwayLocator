<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- 背景外框：深墨蓝圆角基座，确保深浅背景下均清晰可辨 -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#0A1526"/>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="#1B324F" stroke-width="3"/>

  <!-- 青海高原抽象几何山脊线 -->
  <path d="M 34,148 L 86,104 L 120,124 L 138,112 L 172,94 L 222,148" fill="none" stroke="#1E3B5C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 高速公路路基与收敛路径 -->
  <polygon points="76,202 114,116 142,116 180,202" fill="#0F2035"/>
  <line x1="76" y1="202" x2="114" y2="116" stroke="#00C9A7" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="202" x2="142" y2="116" stroke="#00C9A7" stroke-width="8" stroke-linecap="round"/>

  <!-- 公路里程桩号中心分道标线 -->
  <line x1="128" y1="196" x2="128" y2="122" stroke="#F8FAFC" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>

  <!-- 桩号计量工程刻度 (K桩号序列抽象) -->
  <line x1="54" y1="184" x2="74" y2="184" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="184" x2="202" y2="184" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="154" x2="88" y2="154" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="168" y1="154" x2="186" y2="154" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="126" x2="102" y2="126" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="154" y1="126" x2="170" y2="126" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- 定位 Ping 与 WGS-84 坐标瞄准环 -->
  <path d="M 128,108 C 98,78 98,44 128,44 C 158,44 158,78 128,108 Z" fill="#0A1526" stroke="#F8FAFC" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="128" cy="68" r="15" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <line x1="128" y1="48" x2="128" y2="52" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="84" x2="128" y2="88" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="68" x2="112" y2="68" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="144" y1="68" x2="148" y2="68" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- 琥珀色核心定位点 -->
  <circle cx="128" cy="68" r="7" fill="#F59E0B"/>
</svg>
